<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <link rel="stylesheet" href="projects.css">
</head>
<body>

    <header class="header">
        <div class="logo">ProjectFlow</div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="#" class="active">Projects</a>
        </nav>
    </header>

    <main class="main">
        <div class="container">

            <div class="top-bar">
                <h2>Your Projects</h2>
                <button>+ New Project</button>
            </div>

            <div class="projects">

                <div class="project-card">
                    <h3>AI Research Dashboard</h3>
                    <p>Status: <span class="active">Active</span></p>
                    <div class="progress-bar">
                        <div class="progress" style="width:65%"></div>
                    </div>
                </div>

                <div class="project-card">
                    <h3>Mobile Fitness App</h3>
                    <p>Status: <span class="completed">Completed</span></p>
                    <div class="progress-bar">
                        <div class="progress" style="width:100%"></div>
                    </div>
                </div>

                <div class="project-card">
                    <h3>Web Portal Redesign</h3>
                    <p>Status: <span class="pending">Pending</span></p>
                    <div class="progress-bar">
                        <div class="progress" style="width:30%"></div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <footer class="footer">
        © 2026 ProjectFlow · All rights reserved
    </footer>

</body>
</html>
