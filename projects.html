<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <link rel="stylesheet" href="projects.css">
</head>
<body>
 <div id="header-container"></div>

    <main class="main">
        <div class="container">

            <div class="top-bar">
                <h2>Your Projects</h2>
                <button>+ New Project</button>
            </div>

            <div class="projects">

                <div class="project-card">
                    <h3>AI Research Dashboard</h3>
                    <p>Status: <span class="active">Active</span></p>
                    <div class="progress-bar">
                        <div class="progress" style="width:65%"></div>
                    </div>
                </div>

                <div class="project-card">
                    <h3>Mobile Fitness App</h3>
                    <p>Status: <span class="completed">Completed</span></p>
                    <div class="progress-bar">
                        <div class="progress" style="width:100%"></div>
                    </div>
                </div>

                <div class="project-card">
                    <h3>Web Portal Redesign</h3>
                    <p>Status: <span class="pending">Pending</span></p>
                    <div class="progress-bar">
                        <div class="progress" style="width:30%"></div>
                    </div>
                </div>

            </div>

        </div>
    </main>
    <div id="footer-container"></div>
<script src="auth.js"></script>
<script src="layout.js"></script>

</body>
</html>
